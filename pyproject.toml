[project]
name = "ctk-android"
version = "0.1.0"
description = "Complementary Threat Knowledge in Federated Android Malware Detection"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "polars>=1.0",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "torch>=2.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.scripts]
ctk-android = "ctk_android.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "semgrep>=1.78",
    "pandas-stubs",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctk_android"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN", "RUF", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
